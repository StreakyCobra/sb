[default]
image = "localhost/sb:latest"
command = ["zsh"]
git_metadata = true
cpus = 8
memory = "16G"
env = { TERM = "foot-direct", COLORTERM = "truecolor", SB_SANDBOX = "msb" }
volumes = [
  "sb-pacman:/var/cache/pacman/pkg",
  "sb-npm:$${HOME}/.cache/npm",
]
mounts = ["~/.config/starship.toml:$${HOME}/.config/starship.toml:ro"]
# Deny unlisted outbound traffic. Selected groups add their own rules.
# Gateway DNS is allowed automatically.
allowlist = []

# --------------------------------------------------------------------------- #
# Agents                                                                      #
# --------------------------------------------------------------------------- #

[claude]
command = ["claude"]
allowlist = ["api.anthropic.com:443"]
env = { CLAUDE_CONFIG_DIR = "$${HOME}/.claude", DISABLE_AUTOUPDATER = "1" }
mounts = [
  "~/.local/share/sb/claude:$${HOME}/.claude",
  "~/.claude/settings.json:$${HOME}/.claude/settings.json:ro",
  "~/.claude/skills:$${HOME}/.claude/skills:ro",
]

[claude.secrets]
CLAUDE_CODE_OAUTH_TOKEN = { cmd = "pass show keys/anthropic-claude-oauth-token", hosts = ["api.anthropic.com"], headers = ["authorization"] }

[opencode]
command = ["opencode"]
allowlist = ["chatgpt.com:443"]
env = { OPENCODE_DB = "$${SB_PROJECT}.db", OPENCODE_DISABLE_AUTOUPDATE = "1" }
mounts = [
  "~/.local/share/sb/opencode:$${HOME}/.local/share/opencode",
  "~/.config/opencode:$${HOME}/.config/opencode:ro",
]
# The token is read from the host environment once when sb starts.
secrets = { CHATGPT_ACCESS_TOKEN = { hosts = ["chatgpt.com"], headers = ["authorization"] } }

[mcp]
host_ports = [1869, 64342]

# --------------------------------------------------------------------------- #
# Authorized services                                                         #
# --------------------------------------------------------------------------- #

[github]
allowlist = ["api.github.com:443", "github.com:443"]
secrets = { GH_TOKEN = { cmd = "pass show keys/github-token", hosts = ["api.github.com", "github.com"] } }

[circleci]
allowlist = ["circleci.com:443"]
secrets = { CIRCLE_TOKEN = { cmd = "pass show keys/circleci-token", hosts = ["circleci.com"], headers = ["circle-token"] } }

# --------------------------------------------------------------------------- #
# Programming ecosystems                                                      #
# --------------------------------------------------------------------------- #

[pacman]
allowlist = ["mirror.puzzle.ch:443", "mirror.init7.net:443"]

[docker]
args = ["--mount-owned", "/var/lib/docker:kind=disk,size=10G"]

[java]
memory = "24G"  # builds need more than the default; replaces [default]'s value
mounts = ["~/.m2/settings.xml:$${HOME}/.m2/settings.xml:ro"]
volumes = ["sb-m2:$${HOME}/.m2/repository"]

[npm]
mounts = ["~/.npmrc:$${HOME}/.npmrc:ro"]

[web]
include = ["npm"]
ports = ["127.0.0.1:3000:3000"]

[review]
# Use SB_DIFIT_PORT as the server port inside the VM.
# Ports are chosen from 49152-65535 without availability checks or reservations.
random_ports = ["SB_DIFIT_PORT"]
